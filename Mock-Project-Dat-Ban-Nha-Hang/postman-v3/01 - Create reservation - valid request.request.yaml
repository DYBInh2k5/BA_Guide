$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerName": "Nguyen An (sample)",
      "phone": "0900000000",
      "email": "an@example.test",
      "partySize": 4,
      "startAt": "2026-12-05T19:00:00+07:00",
      "note": "Sample request"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('reservation starts pending', function () { pm.expect(body.status).to.eql('PENDING'); });
      pm.collectionVariables.set('reservationCode', body.reservationCode);
    language: text/javascript
order: 2000
