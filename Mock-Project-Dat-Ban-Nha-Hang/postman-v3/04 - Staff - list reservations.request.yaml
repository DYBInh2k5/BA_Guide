$kind: http-request
url: "{{baseUrl}}/api/reservations?date=2026-12-05"
method: GET
headers:
  X-Training-Staff: demo
scripts:
  - type: afterResponse
    code: |-
      pm.test('staff can list sample reservations', function () { pm.response.to.have.status(200); });
      pm.test('list response includes items', function () { pm.expect(pm.response.json().items).to.be.an('array'); });
    language: text/javascript
order: 5000
